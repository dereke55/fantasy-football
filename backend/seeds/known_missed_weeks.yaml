# known_missed_weeks — hand-curated PLAYER table (not per team).
#
# One row per fantasy-relevant QB/RB/WR/TE (roughly top-250 ADP, plus a few announced
# IR/PUP/suspension cases) with a currently announced absence or a genuinely open Week 1
# status as of 2026-08-29. Healthy players are NOT listed.
#
# known_missed_weeks = best-estimate integer of 2026 REG weeks missed counting from Week 1:
#   IR = season (17) unless a return is expected; PUP = at least 4; suspension = its length;
#   week-to-week / "Week 1 uncertain" = 1-2; 0 = listed (Questionable) but expected for Week 1.
# status ∈ {IR, PUP, Suspended, Out, Doubtful, Questionable}.
# YAML gotcha: the Saints code must be written "NO" (quoted) — bare NO parses as boolean false.
#
# Primary source: ESPN injuries JSON (https://site.api.espn.com/apis/site/v2/sports/football/nfl/injuries,
# fetched 2026-08-29T23:26Z). NOTE: that feed is capped at 25 entries per team, so a few players
# (e.g. Kamara, Tyson, Dell) come from ESPN team injury pages / CBS tracker instead.
# Cross-checked against the Sleeper players snapshot in raw_sleeper_players (2026-08-29) and
# nflverse roster_2026 (gsis_id). Every row carries source_url, confidence, last_checked.
#
# Excluded on purpose (checked 2026-08-29): Daniel Jones (IND, Achilles — fully cleared, not on the
# Colts injury report), Bo Nix (DEN — started the Aug 22 preseason game), Ozzy Trapilo (CHI OT —
# out most of 2026 but OL, not a fantasy position), Tyreek Hill / Joe Mixon (unsigned free agents).
# Re-check after roster cutdown (Tue Sep 1): reserve/PUP and IR designations become official then.


# Field notes
#   hc / hc_new / hc_since   Head coach, new for 2026, first season with the team — Wikipedia "List of current NFL head coaches" (fetched 2026-08-29)
#   oc / oc_new              Offensive coordinator — Wikipedia "List of current NFL offensive coordinators" (since = 2026 -> oc_new; 21 teams)
#   dc / dc_new              Defensive coordinator — Wikipedia "List of current NFL defensive coordinators" (since = 2026 -> dc_new; 15 teams)
#   play_caller              Person who calls OFFENSIVE plays in 2026 (primary caller; preseason one-off delegations are ignored)
#   play_caller_role         HC | OC | other
#   play_caller_new          true when play_caller is a different person from the 2025 primary caller (drives the new_play_caller flag)
#   play_caller_2025         2025 primary caller; midseason handoffs are listed with week ranges
#   confidence               high | medium | low (task spec). fansports "Authority" % is quoted in notes for play-caller rows; the five

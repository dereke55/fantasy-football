[project]
name = "ff-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "nflreadpy>=0.1.5",
    "numpy>=2.5.2",
    "polars>=1.44.1",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "sqlalchemy>=2",
    "sse-starlette>=3.4.8",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
    "yahoo-oauth>=2.1.1",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[project.scripts]
ff = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
